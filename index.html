<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MaxBuildsXJ | Trail Guides & Builds</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Header -->
<div id="header"></div>

<script>
fetch("header.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("header").innerHTML = data;
  });
</script>
  <!-- Hero Section -->
  <section class="hero">
    <h1>Welcome to MaxBuildsXJs</h1>
    <p>Trail guides, off-road builds, and everything Jeep.</p>
    <a href="trails.html" class="btn">Explore Trails</a>
  </section>

  <!-- Featured Trail -->
  <section id="trails">
    <div class="section-content">
      <h2>Featured Trail</h2>
      <p>South Meadow Creek Trail</p>
    </div>

    <div class="gallery">
      <img src="images/smct1.jpeg" alt="My XJ on Red Elephant Hill">
      <img src="images/smct2.jpeg" alt="Trail map">
    </div>
  </section>

  <!-- Footer -->
 <div id="footer"></div>

<script>
fetch("footer.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("footer").innerHTML = data;
  });
</script>
</body>
</html>
